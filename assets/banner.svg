<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#0d1b3a"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #ffffff;
    }
    
    /* Dynamic Pulsing Lens Animation */
    @keyframes pulse-red {
      0% { fill-opacity: 0.3; r: 14; }
      50% { fill-opacity: 1; r: 18; }
      100% { fill-opacity: 0.3; r: 14; }
    }
    @keyframes scan-line {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0.2; }
    }
    @keyframes wave-move {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-40px); }
    }

    .rec-dot {
      animation: pulse-red 2s infinite ease-in-out;
    }
    .scanner {
      animation: scan-line 4s infinite linear;
    }
    .wave {
      animation: wave-move 3s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />

  <!-- Grid Tech Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" />
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" />
  </g>

  <!-- Animated Audio/Video Spectrum Lines (Background Dynamic Layer) -->
  <g opacity="0.25" transform="translate(820, 90)">
    <rect x="0" y="20" width="8" height="80" rx="4" fill="#00f2fe" />
    <rect x="18" y="0" width="8" height="120" rx="4" fill="#00f2fe" />
    <rect x="36" y="40" width="8" height="60" rx="4" fill="#00f2fe" />
    <rect x="54" y="10" width="8" height="100" rx="4" fill="#00f2fe" />
    <rect x="72" y="30" width="8" height="70" rx="4" fill="#00f2fe" />
    <rect x="90" y="50" width="8" height="40" rx="4" fill="#00f2fe" />
  </g>

  <!-- Dynamic BWC Bodycam Graphic Element (Right Side) -->
  <g transform="translate(960, 50)">
    <!-- BWC Body Case -->
    <rect x="0" y="0" width="160" height="220" rx="24" fill="#0f172a" stroke="#334155" stroke-width="4" filter="url(#glow)" />
    <!-- Lens Ring -->
    <circle cx="80" cy="80" r="46" fill="#1e293b" stroke="url(#accentGradient)" stroke-width="4" />
    <circle cx="80" cy="80" r="28" fill="#090d16" />
    <!-- Lens Center Glass -->
    <circle cx="80" cy="80" r="16" fill="#ff0844" class="rec-dot" />
    
    <!-- REC Indicator Badge -->
    <rect x="42" y="150" width="76" height="26" rx="6" fill="#ef4444" opacity="0.9"/>
    <text x="80" y="167" class="tag" text-anchor="middle">LIVE REC</text>

    <!-- Sensor line -->
    <line x1="30" y1="192" x2="130" y2="192" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unhidden & Clear) -->
  
  <!-- Pill Badges -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="160" height="30" rx="15" fill="url(#accentGradient)" />
    <text x="80" y="20" class="tag" text-anchor="middle">CURATED ECOSYSTEM</text>
    
    <rect x="172" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="237" y="20" class="tag" fill="#cbd5e1" text-anchor="middle">SAAS &amp; OPEN SOURCE</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" class="title">
    Awesome Body-Worn Camera Platform 📹
  </text>

  <!-- Accent Divider Line -->
  <rect x="60" y="152" width="720" height="4" rx="2" fill="url(#accentGradient)" />

  <!-- Subtitle Description -->
  <text x="60" y="192" class="subtitle">
    Digital Evidence Management (DEMS), Officer Safety &amp; Public Transparency Tools
  </text>
  <text x="60" y="222" class="subtitle" font-size="16" fill="#64748b">
    Comprehensive guide covering Axon, Motorola, Reveal, Copcast, IncidentLens &amp; modern video analytics.
  </text>

  <!-- Bottom Stat Cards -->
  <g transform="translate(60, 252)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#38bdf8" font-weight="bold">🎯 Market Leader:</text>
    <text x="120" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff">Axon ($36B)</text>

    <!-- Card 2 -->
    <rect x="195" y="0" width="220" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="211" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#34d399" font-weight="bold">📊 Sector Market Size:</text>
    <text x="350" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff">$10B+ DEMS</text>

    <!-- Card 3 -->
    <rect x="430" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="446" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#fbbf24" font-weight="bold">⚡ Market Type:</text>
    <text x="540" y="24" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff">Concentrated</text>
  </g>
</svg>
